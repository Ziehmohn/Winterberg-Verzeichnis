<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="eD2M5X0XpFemq843s7x3232ic58ogimCDB6zWKPN_u8" />
    <meta name="description" content="Das große Verzeichnis für alle Unternehmen, Handwerker und Dienstleister in Winterberg und Umgebung." />
    <meta property="og:site_name" content="Das Winterberg Verzeichnis" />
    <meta property="og:title" content="Das Winterberg Verzeichnis" />
    <meta property="og:description" content="Das große Verzeichnis für alle Unternehmen, Handwerker und Dienstleister in Winterberg und Umgebung." />
    <meta name="author" content="Das Winterberg Verzeichnis" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Das Winterberg Verzeichnis",
      "alternateName": "Winterberg Verzeichnis",
      "url": "https://www.winterberg-verzeichnis.de/",
      "description": "Das große Verzeichnis für alle Unternehmen, Handwerker und Dienstleister in Winterberg und Umgebung.",
      "publisher": {
        "@type": "Organization",
        "name": "Das Winterberg Verzeichnis",
        "url": "https://www.winterberg-verzeichnis.de/"
      }
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Das Winterberg Verzeichnis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" />
    <style id="skeleton-styles">
      /* Skeleton-only styles – scoped to #skeleton-ui, removed when React mounts */
      body { margin: 0; background: #FAF8F5; }
      #skeleton-ui .sk-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.96);backdrop-filter:blur(10px);border-bottom:1px solid #E7E2DA}
      #skeleton-ui .sk-header-inner{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px}
      #skeleton-ui .sk-logo-text{display:inline-block}
      #skeleton-ui .sk-logo-main{font-family:"Outfit",sans-serif;font-size:24px;font-weight:800;letter-spacing:.05em;color:#0F4C2E;display:block;line-height:1}
      #skeleton-ui .sk-logo-sub{font-family:"Outfit",sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.34em;color:#1B211D;display:block;margin-top:3px}
      #skeleton-ui .sk-logo-pre{font-family:"Outfit",sans-serif;font-size:15px;font-weight:500;color:#5F6B63}
      #skeleton-ui .sk-nav{display:none;gap:22px;font-size:15px;font-weight:500;margin-left:auto;color:#0F4C2E}
      @media(min-width:768px){#skeleton-ui .sk-nav{display:flex}}
      #skeleton-ui .sk-nav a{color:#0F4C2E;text-decoration:none}
      #skeleton-ui .sk-cta{display:none;background:#F2761B;color:#fff;border:none;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:600}
      @media(min-width:768px){#skeleton-ui .sk-cta{display:block}}
      #skeleton-ui .sk-hero{max-width:1180px;margin:0 auto;padding:50px 24px 36px}
      #skeleton-ui .sk-hero h1{font-family:"Outfit",sans-serif;font-size:clamp(32px,5vw,54px);font-weight:800;line-height:1.08;color:#0F4C2E;margin:0 0 14px}
      #skeleton-ui .sk-hero p{font-size:17px;line-height:1.65;color:#4A544D;max-width:56ch;margin:0 0 28px}
      #skeleton-ui .sk-search{max-width:560px;display:flex;align-items:center;background:#fff;border:1px solid #E7E2DA;border-radius:999px;padding:6px 6px 6px 22px;box-shadow:0 6px 18px rgba(27,33,29,0.05)}
      #skeleton-ui .sk-search input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:#1B211D;font-family:inherit}
      #skeleton-ui .sk-search input::placeholder{color:#8A928B}
      #skeleton-ui .sk-search-btn{width:44px;height:44px;border-radius:50%;background:#0F4C2E;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}
      #skeleton-ui .sk-cards{max-width:1180px;margin:0 auto;padding:0 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
      #skeleton-ui .sk-card{background:#fff;border:1px solid #EDE8E0;border-radius:20px;padding:22px;animation:sk-pulse 1.8s ease-in-out infinite alternate}
      #skeleton-ui .sk-card-top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
      #skeleton-ui .sk-avatar{width:48px;height:48px;border-radius:14px;background:#F3F0EA;flex-shrink:0}
      #skeleton-ui .sk-line{height:14px;background:#F3F0EA;border-radius:8px}
      #skeleton-ui .sk-line.w60{width:60%}
      #skeleton-ui .sk-line.w80{width:80%}
      #skeleton-ui .sk-line.w40{width:40%}
      #skeleton-ui .sk-line.short{height:12px;margin-top:6px}
      @keyframes sk-pulse{0%{opacity:1}100%{opacity:.55}}
      @keyframes sk-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="skeleton-ui">
        <header class="sk-header">
          <div class="sk-header-inner">
            <div style="display:flex;align-items:baseline;gap:8px">
              <span class="sk-logo-pre">Das</span>
              <span class="sk-logo-text">
                <span class="sk-logo-main">WINTERBERG</span>
                <svg viewBox="0 0 200 10" preserveAspectRatio="none" style="width:100%;height:7px;display:block;margin-top:2px"><path d="M3 7C38 2 78 1 118 4c28 2 52 5 79 1" stroke="#F2761B" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>
                <span class="sk-logo-sub">VERZEICHNIS</span>
              </span>
            </div>
            <nav class="sk-nav">
              <a href="/">Start</a>
              <a href="/alle-unternehmen">Alle Unternehmen</a>
              <a href="/jobs">Jobs</a>
              <a href="/preise">Preise</a>
            </nav>
            <span class="sk-cta">Unternehmen eintragen</span>
          </div>
        </header>
        <section class="sk-hero">
          <h1>Winterberger<br>Unternehmen</h1>
          <p>Das umfassende Verzeichnis für alle Unternehmen, Dienstleister, Handwerker und Freizeiteinrichtungen in Winterberg und den umliegenden Ortsteilen.</p>
          <div class="sk-search">
            <input type="text" placeholder="Unternehmen suchen..." disabled />
            <span class="sk-search-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
          </div>
        </section>
        <div class="sk-cards">
          <div class="sk-card"><div class="sk-card-top"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w40 short"></div></div></div><div class="sk-line w80" style="margin-top:8px"></div></div>
          <div class="sk-card" style="animation-delay:.15s"><div class="sk-card-top"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w40 short"></div></div></div><div class="sk-line w80" style="margin-top:8px"></div></div>
          <div class="sk-card" style="animation-delay:.3s"><div class="sk-card-top"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w40 short"></div></div></div><div class="sk-line w80" style="margin-top:8px"></div></div>
          <div class="sk-card" style="animation-delay:.45s"><div class="sk-card-top"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w40 short"></div></div></div><div class="sk-line w80" style="margin-top:8px"></div></div>
          <div class="sk-card" style="animation-delay:.6s"><div class="sk-card-top"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w40 short"></div></div></div><div class="sk-line w80" style="margin-top:8px"></div></div>
          <div class="sk-card" style="animation-delay:.75s"><div class="sk-card-top"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line w60"></div><div class="sk-line w40 short"></div></div></div><div class="sk-line w80" style="margin-top:8px"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
