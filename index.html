<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="egCnwQfOIztQ10Cv0RUn3psnTm0tyaOUmOrGdpv2Z4c" />
    <meta name="description" content="Das große Verzeichnis für alle Unternehmen, Handwerker und Dienstleister in Winterberg und Umgebung." />
    <meta property="og:site_name" content="Winterberger Unternehmen" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Winterberger Unternehmen",
      "url": "https://winterberg.sichtbar-online.com/"
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

  </head>
  <body>
    <div id="root">
      <style>
        body { margin: 0; background: #FAF8F5; }
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .loader-spinner {
          width: 40px;
          height: 40px;
          border: 3px solid rgba(15, 76, 46, 0.1);
          border-radius: 50%;
          border-top-color: #0F4C2E;
          animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader">
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
